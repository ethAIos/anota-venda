name: Mirror to Codeberg

on:
  push:
    branches: ["**"]
    tags: ["**"]

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_OWNER: ethAIos
        run: |
          if [ -z "$CODEBERG_TOKEN" ]; then
            echo "CODEBERG_TOKEN secret is not configured; skipping mirror."
            exit 0
          fi

          repo_name="${GITHUB_REPOSITORY#*/}"
          mirror_url="https://oauth2:${CODEBERG_TOKEN}@codeberg.org/${CODEBERG_OWNER}/${repo_name}.git"

          git remote add codeberg "$mirror_url"
          git push codeberg --all
          git push codeberg --tags
